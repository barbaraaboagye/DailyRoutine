<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Dash | Je Parle English</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Comic Neue', cursive;
            overflow: hidden;
            touch-action: none;
            transition: background 1s ease;
        }

        .fun-font { font-family: 'Fredoka One', cursive; }

        /* Dynamic Backgrounds */
        body.morning { background: #4FC3F7; } /* Light Blue */
        body.afternoon { background: #FFD54F; } /* Yellow */
        body.evening { background: #7986CB; } /* Indigo */
        body.night { background: #283593; color: white; } /* Dark Blue */

        /* The Stage */
        .stage-container {
            width: 90%; max-width: 500px; aspect-ratio: 1;
            background: rgba(255,255,255,0.9);
            border-radius: 30px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.1);
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            border: 8px solid white;
        }

        /* The Monster (Momo) */
        .monster {
            font-size: 120px;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }
        
        /* Object Props (Toothbrush, Food, etc) */
        .prop {
            position: absolute;
            font-size: 60px;
            transition: all 0.5s ease;
            opacity: 0;
        }

        /* Animations */
        .bounce { animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -60%) scale(1.1); } }
        
        .sleeping { animation: breathe 3s infinite ease-in-out; }
        @keyframes breathe { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.05); } }

        /* Mic Button */
        .mic-btn {
            width: 70px; height: 70px; /* Slightly smaller to fit controls */
            border-radius: 50%;
            background: #ff5252;
            color: white;
            font-size: 28px;
            box-shadow: 0 6px 0 #d32f2f;
            transition: all 0.1s;
            display: flex; align-items: center; justify-content: center;
        }
        .mic-btn:active, .mic-btn.active {
            transform: translateY(6px);
            box-shadow: none;
            background: #ff1744;
        }
        .mic-btn.disabled { filter: grayscale(1); opacity: 0.5; pointer-events: none; }

        /* Speech Bubble */
        .bubble {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            background: white; padding: 15px 25px; border-radius: 20px;
            border: 3px solid #333; font-weight: bold; font-size: 1.2rem;
            white-space: nowrap; color: #333; opacity: 0; transition: opacity 0.3s;
            z-index: 20;
        }
        .bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            border-width: 10px 10px 0; border-style: solid;
            border-color: #333 transparent; display: block; width: 0;
        }
        .bubble.show { opacity: 1; top: 15%; }

        /* Progress Bar (The Sun) */
        .progress-track {
            width: 80%; height: 10px; background: rgba(0,0,0,0.1);
            border-radius: 10px; margin: 10px auto; position: relative;
        }
        .sun-marker {
            font-size: 30px; position: absolute; top: -15px; left: 0%;
            transition: left 0.5s ease;
        }

        .confetti { position: absolute; font-size: 20px; animation: fall 2s linear forwards; }
        @keyframes fall { 0% { top: -10%; transform: rotate(0deg); } 100% { top: 110%; transform: rotate(360deg); } }

        /* Phase Buttons */
        .phase-btn {
            background: rgba(255,255,255,0.3); border: 2px solid white; color: white;
            font-weight: bold; font-size: 0.7rem; padding: 4px 8px; rounded-full;
            transition: all 0.2s; text-transform: uppercase;
        }
        .phase-btn:hover { background: white; color: #333; }
        
        input[type=range] { accent-color: white; }

    </style>
</head>
<body class="morning flex flex-col items-center justify-between min-h-screen p-2 pb-8">

    <!-- Header -->
    <header class="w-full text-center pt-2">
        <h1 class="text-2xl md:text-3xl fun-font text-white drop-shadow-md">Daily Dash</h1>
        <div class="flex justify-center items-center gap-2 text-white/90 font-bold text-lg">
            <i class="fa-regular fa-clock"></i> <span id="timeDisplay">7:00 AM</span>
        </div>
    </header>

    <!-- Progress -->
    <div class="w-full max-w-md">
        <div class="progress-track">
            <div id="sunMarker" class="sun-marker">☀️</div>
        </div>
    </div>

    <!-- Main Stage -->
    <main class="stage-container" id="stage">
        <!-- Speech Bubble -->
        <div id="speechBubble" class="bubble">Wake up!</div>
        
        <!-- The Monster -->
        <div id="momo" class="monster sleeping">😴</div>

        <!-- Props Layer -->
        <div id="propLayer"></div>
    </main>

    <!-- Controls -->
    <div class="w-full max-w-md flex flex-col items-center gap-3">
        
        <!-- Instruction Text -->
        <div class="bg-white/90 px-6 py-2 rounded-xl shadow-lg text-center w-full">
            <p class="text-gray-500 text-xs uppercase font-bold">Command:</p>
            <p id="commandText" class="text-xl md:text-2xl fun-font text-slate-800">"Wake up!"</p>
            <button onclick="game.playAudio()" class="mt-1 text-blue-500 hover:text-blue-700 text-xs font-bold flex items-center justify-center gap-1 mx-auto">
                <i class="fa-solid fa-volume-high"></i> Listen
            </button>
        </div>

        <div class="flex items-center w-full gap-4 px-2">
            <!-- Mic Button -->
            <div class="relative flex-none">
                <div class="absolute -inset-4 bg-white/20 rounded-full animate-ping hidden" id="micRing"></div>
                <button id="micBtn" 
                    onmousedown="game.startSpeaking()" 
                    onmouseup="game.stopSpeaking()" 
                    ontouchstart="game.startSpeaking()" 
                    ontouchend="game.stopSpeaking()"
                    class="mic-btn relative z-10">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>
            
            <!-- Time Controls (Slider + Phases) -->
            <div class="flex-1 bg-black/10 rounded-xl p-3 backdrop-blur-sm">
                <div class="flex justify-between mb-2">
                    <button onclick="game.jumpToPhase('morning')" class="phase-btn">Morn</button>
                    <button onclick="game.jumpToPhase('afternoon')" class="phase-btn">Aft</button>
                    <button onclick="game.jumpToPhase('evening')" class="phase-btn">Eve</button>
                    <button onclick="game.jumpToPhase('night')" class="phase-btn">Night</button>
                </div>
                <input type="range" id="timeSlider" min="0" max="10" value="0" class="w-full cursor-pointer h-2 bg-white/30 rounded-lg appearance-none" oninput="game.onSliderChange(this.value)">
                <div class="text-[10px] text-white/70 text-center mt-1 font-bold">SLIDE TO CHANGE TIME</div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <div class="fixed bottom-1 w-full text-center pointer-events-none z-0">
        <span class="text-[10px] text-white/50 font-bold">Je Parle English &copy; 2025</span>
    </div>

    <!-- Win Modal -->
    <div id="winModal" class="fixed inset-0 bg-black/80 z-50 hidden flex flex-col items-center justify-center text-center p-4">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full animate-bounce">
            <div class="text-6xl mb-4">🌙</div>
            <h2 class="text-3xl fun-font text-purple-600 mb-2">Good Night!</h2>
            <p class="text-gray-600 mb-6">Momo finished the day!</p>
            <button onclick="location.reload()" class="bg-purple-600 text-white px-8 py-3 rounded-full font-bold shadow-lg hover:bg-purple-500 transition">
                Play Again
            </button>
        </div>
    </div>

    <script>
        /* ================= GAME DATA ================= */
        const routines = [
            { 
                time: "7:00 AM", phase: "morning", command: "Wake up!", 
                monster: "😴", actionMonster: "🥱", prop: "", sound: "Yawn!"
            },
            { 
                time: "7:15 AM", phase: "morning", command: "Get up!", 
                monster: "🥱", actionMonster: "🧍", prop: "", sound: "Up we go!"
            },
            { 
                time: "7:30 AM", phase: "morning", command: "Brush your teeth!", 
                monster: "😐", actionMonster: "😬", prop: "🪥", 
                propAnim: "left: 60%; top: 45%; animation: shake 0.5s infinite;",
                sound: "Brush brush!"
            },
            { 
                time: "7:45 AM", phase: "morning", command: "Get dressed!", 
                monster: "🧍", actionMonster: "👕", prop: "", sound: "Looking good!"
            },
            { 
                time: "8:00 AM", phase: "morning", command: "Eat breakfast!", 
                monster: "😋", actionMonster: "🥣", prop: "🥄",
                propAnim: "left: 60%; top: 60%; animation: bounce 1s infinite;", 
                sound: "Yummy!"
            },
            { 
                time: "8:30 AM", phase: "morning", command: "Go to school!", 
                monster: "🎒", actionMonster: "🚌", prop: "", sound: "Bye bye!"
            },
            { 
                time: "10:00 AM", phase: "morning", command: "Study English!", 
                monster: "🏫", actionMonster: "📝", prop: "📚",
                propAnim: "left: 65%; top: 55%;",
                sound: "A-B-C!"
            },
            { 
                time: "12:00 PM", phase: "afternoon", command: "Eat lunch!", 
                monster: "😋", actionMonster: "🥪", prop: "", sound: "Tasty!"
            },
            { 
                time: "3:00 PM", phase: "afternoon", command: "Go home!", 
                monster: "🚌", actionMonster: "🏠", prop: "", sound: "Home sweet home!"
            },
            { 
                time: "4:00 PM", phase: "afternoon", command: "Do homework!", 
                monster: "🤔", actionMonster: "✍️", prop: "📝", 
                propAnim: "left: 60%; top: 60%;",
                sound: "Work work!"
            },
            { 
                time: "5:00 PM", phase: "afternoon", command: "Play soccer!", 
                monster: "🏃", actionMonster: "⚽", prop: "", sound: "Goal!"
            },
            { 
                time: "6:00 PM", phase: "evening", command: "Eat dinner!", 
                monster: "🍽️", actionMonster: "🍝", prop: "🥤",
                propAnim: "left: 70%; top: 60%;",
                sound: "Delish!"
            },
            { 
                time: "7:00 PM", phase: "evening", command: "Take a shower!", 
                monster: "🚿", actionMonster: "🧼", prop: "duck", sound: "Splash!"
            },
            { 
                time: "7:30 PM", phase: "evening", command: "Read a book!", 
                monster: "🤓", actionMonster: "📖", prop: "", sound: "Once upon a time..."
            },
            { 
                time: "8:00 PM", phase: "night", command: "Go to sleep!", 
                monster: "🥱", actionMonster: "😴", prop: "🌙", sound: "Goodnight!"
            }
        ];

        /* ================= ENGINE ================= */
        const game = {
            step: 0,
            isSpeaking: false,
            
            init: () => {
                document.getElementById('timeSlider').max = routines.length - 1;
                game.renderScene();
            },

            onSliderChange: (val) => {
                game.step = parseInt(val);
                game.renderScene();
            },

            jumpToPhase: (phase) => {
                const idx = routines.findIndex(r => r.phase === phase);
                if(idx !== -1) {
                    game.step = idx;
                    game.renderScene();
                }
            },

            renderScene: () => {
                const data = routines[game.step];
                
                // 1. Update Text & HUD
                document.getElementById('timeDisplay').innerText = data.time;
                document.getElementById('commandText').innerText = `"${data.command}"`;
                document.body.className = `${data.phase} flex flex-col items-center justify-between min-h-screen p-4 pb-8`;
                
                // 2. Update Progress Bar (Sun Movement) & Slider
                const pct = (game.step / (routines.length - 1)) * 90;
                document.getElementById('sunMarker').style.left = `${pct}%`;
                document.getElementById('sunMarker').innerText = data.phase === 'night' ? '🌙' : '☀️';
                document.getElementById('timeSlider').value = game.step;

                // 3. Reset Stage
                const momo = document.getElementById('momo');
                momo.innerText = data.monster;
                momo.className = "monster"; // Reset anims
                if(game.step === 0 || game.step === routines.length-1) momo.classList.add('sleeping');
                
                document.getElementById('propLayer').innerHTML = ''; // Clear props
                document.getElementById('speechBubble').classList.remove('show');
                
                // Reset Button
                const btn = document.getElementById('micBtn');
                btn.classList.remove('disabled');
            },

            playAudio: () => {
                const text = routines[game.step].command;
                const utter = new SpeechSynthesisUtterance(text);
                utter.rate = 0.8;
                utter.pitch = 1.2; // Kid friendly pitch
                window.speechSynthesis.speak(utter);
            },

            startSpeaking: (e) => {
                if(e) e.preventDefault();
                game.isSpeaking = true;
                document.getElementById('micBtn').classList.add('active');
                document.getElementById('micRing').classList.remove('hidden');
                
                // Visual feedback that "voice is being detected" (Simulation)
                const momo = document.getElementById('momo');
                momo.style.transform = "translate(-50%, -50%) scale(1.1)";
            },

            stopSpeaking: (e) => {
                if(e) e.preventDefault();
                if(!game.isSpeaking) return;
                
                game.isSpeaking = false;
                document.getElementById('micBtn').classList.remove('active');
                document.getElementById('micRing').classList.add('hidden');
                
                // Simulate "Recognition Success"
                game.triggerSuccess();
            },

            triggerSuccess: () => {
                const data = routines[game.step];
                const momo = document.getElementById('momo');
                const btn = document.getElementById('micBtn');

                // Disable button
                btn.classList.add('disabled');

                // 1. Change Monster Emoji
                momo.innerText = data.actionMonster;
                momo.classList.add('bounce');
                
                // 2. Show Speech Bubble Response
                const bubble = document.getElementById('speechBubble');
                bubble.innerText = data.sound;
                bubble.classList.add('show');

                // 3. Add Props
                if(data.prop) {
                    const p = document.createElement('div');
                    p.className = 'prop';
                    p.innerText = data.prop;
                    if(data.propAnim) p.style.cssText = data.propAnim;
                    document.getElementById('propLayer').appendChild(p);
                    // Fade in prop
                    setTimeout(() => p.style.opacity = 1, 100);
                }

                // 4. Confetti Reward
                game.confetti();

                // 5. Auto Advance
                setTimeout(() => {
                    game.step++;
                    if(game.step >= routines.length) {
                        game.win();
                    } else {
                        game.renderScene();
                    }
                }, 2500);
            },

            confetti: () => {
                const stage = document.getElementById('stage');
                for(let i=0; i<10; i++) {
                    const c = document.createElement('div');
                    c.innerText = ['⭐','✨','🎉'][Math.floor(Math.random()*3)];
                    c.className = 'confetti';
                    c.style.left = Math.random() * 100 + '%';
                    c.style.animationDuration = (1 + Math.random()) + 's';
                    stage.appendChild(c);
                    setTimeout(() => c.remove(), 2000);
                }
            },

            win: () => {
                document.getElementById('winModal').classList.remove('hidden');
            }
        };

        // Init
        game.init();

    </script>
</body>
</html>
